<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>Azimi Store</title>
<link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b3d2e"><meta property="og:title" content="Azimi Store"><meta property="og:description" content="Quality Products • Better Life"><meta property="og:image" content="logo.png"><script src="config.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f4ee;--card:#fff;--tx:#1b1b1b;--mut:#6b6b6b;--ac:#0e8f6a;--gd:#c9971c;--bd:#e4dfd2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10150f;--card:#1a211a;--tx:#f0efe8;--mut:#a5a89c;--bd:#2c352b}}
:root[data-theme="dark"]{--bg:#10150f;--card:#1a211a;--tx:#f0efe8;--mut:#a5a89c;--bd:#2c352b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,"Segoe UI",system-ui,sans-serif;font-size:18px;line-height:1.7;transition:background 1.8s ease,color 1.8s ease}
#splash{position:fixed;inset:0;background:linear-gradient(120deg,#05261c,#0b3d2e,#0e5a47,#3a2a05,#0b3d2e);background-size:300% 300%;animation:gs 6s ease infinite;display:flex;align-items:center;justify-content:center;overflow:hidden;z-index:99;transition:opacity .5s,visibility .5s,transform .5s}
#splash.off{opacity:0;visibility:hidden;transform:scale(1.2)}
#splash b{font:700 clamp(40px,12vw,92px) Georgia,serif;color:#f3d27a;text-shadow:0 0 18px #f3d27a99,0 0 55px #c9971c80;letter-spacing:4px;direction:ltr;display:flex}
#splash b span{opacity:0;transform:translateY(30px) scale(.6);animation:pop .35s forwards}
@keyframes pop{to{opacity:1;transform:none}}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);display:flex;gap:10px;padding:12px;overflow-x:auto;align-items:center;justify-content:center;flex-wrap:wrap}
nav button{white-space:nowrap;font-size:18px;padding:13px 18px;min-height:50px;font-weight:700}
.logo{font:700 24px Georgia,serif;color:var(--gd);direction:ltr;margin:0 8px}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;cursor:pointer;font-weight:600;transition:.25s transform,.25s background,.25s color}button:hover{transform:translateY(-2px)}button svg{margin-inline-end:6px}
button.on,.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
input,select,textarea{width:100%;padding:9px;margin:4px 0;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
main{max-width:1000px;margin:auto;padding:14px;position:relative;z-index:1}#bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(circle at 15% 10%,#0e8f6a30,transparent 55%),radial-gradient(circle at 85% 90%,#c9971c30,transparent 55%)}#bgfx span{position:absolute;bottom:-60px;color:var(--ac);opacity:.14;animation:fl linear infinite}@keyframes fl{from{transform:translateY(0) rotate(0)}to{transform:translateY(-115vh) rotate(360deg)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.card img{width:100%;height:180px;object-fit:cover;border-radius:10px}
.ph{height:180px;border-radius:10px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:64px}.card h4{font-size:19px;margin:10px 0 4px}.card{transition:transform .2s}.card:hover{transform:translateY(-3px)}
.hero{border-radius:18px;padding:32px 16px;text-align:center;color:#fff;background:linear-gradient(135deg,#0b3d2e,#0e8f6a);margin-bottom:14px}
.hero h1{margin:0 0 8px;font-size:42px}#tw{min-height:72px;font-size:24px;color:#f3d27a}
.ban{height:190px;border-radius:18px;margin-bottom:14px;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;font-size:28px;overflow:hidden;transition:background .4s}
.ban .bi{font-size:64px;animation:bn 1s infinite alternate}
@keyframes bn{from{transform:scale(.8) rotate(-8deg)}to{transform:scale(1.15) rotate(8deg)}}
.bar{height:4px;background:#fff8;width:0}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;margin-bottom:14px}
.cats button{padding:14px 6px;text-align:center}.cats svg{display:block;margin:0 auto 6px;font-size:34px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mut{color:var(--mut);font-size:15px}.pr{color:var(--ac);font-weight:700;font-size:21px}
svg text{font-size:11px;fill:var(--tx)}svg circle{fill:var(--ac);cursor:pointer}svg circle:hover{fill:var(--gd)}
.af-map-card{margin-top:10px!important;padding:10px!important;overflow:hidden}.af-map-wrap{position:relative;width:100%;max-width:980px;margin:auto;aspect-ratio:1698/1305;border-radius:18px;overflow:hidden;background:#dcebd9}.af-map-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}.af-map-wrap #map{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.af-map-wrap #map .province-pin circle{fill:#0e8f6a;stroke:#fff;stroke-width:4;cursor:pointer;filter:drop-shadow(0 2px 4px #0008)}.af-map-wrap #map .province-pin text{font-size:19px;font-weight:700;fill:#10251b;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round;pointer-events:none}.af-map-wrap #map .province-pin:hover circle{fill:#d4a017;transform-origin:center;transform-box:fill-box;transform:scale(1.35)}.af-map-wrap #map .my-gps circle:first-child{fill:#e03131;stroke:#fff;stroke-width:5}.af-map-wrap #map .my-gps circle:last-child{fill:none;stroke:#e03131;stroke-width:5;opacity:.65;animation:gpsPulse 1.5s infinite}.af-map-note{text-align:center;margin-top:8px;color:var(--mut);font-size:13px}@keyframes gpsPulse{0%{transform:scale(.65);opacity:.8}70%{transform:scale(1.35);opacity:0}100%{transform:scale(1.35);opacity:0}}

.av{width:90px;height:90px;border-radius:50%;object-fit:cover;background:var(--bd)}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:start}
.sl{position:relative;height:170px;border-radius:18px;overflow:hidden;margin-bottom:14px}.sl>div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;font-size:26px;opacity:0;transition:opacity .8s}.sl>div.a{opacity:1}.sl svg{font-size:58px}nav button svg{margin-inline-end:6px}.ph{flex-direction:column}.ss{position:relative;height:180px;border-radius:10px;overflow:hidden}.ss img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s}.ss img.a{opacity:1;animation:kb 3.4s ease-out forwards}@keyframes kb{from{transform:scale(1)}to{transform:scale(1.13)}}@keyframes gs{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
#splash .sc{position:relative;z-index:2;text-align:center}#splash .st{color:#fff;opacity:0;font-size:clamp(16px,4vw,24px);margin-top:10px;animation:fi .4s .45s forwards}@keyframes fi{to{opacity:.95}}
#splash .pb{width:min(260px,60vw);height:4px;background:#ffffff30;border-radius:4px;margin:22px auto 0;overflow:hidden}#splash .pb u{display:block;height:100%;width:0;background:linear-gradient(90deg,#c9971c,#f3d27a);animation:pg .95s .05s forwards}@keyframes pg{to{width:100%}}
#splash .rg{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border:2px solid #f3d27a;border-radius:50%;opacity:0;animation:rg 1.5s ease-out infinite}@keyframes rg{0%{transform:scale(.3);opacity:.7}100%{transform:scale(9);opacity:0}}
#splash .sp2{position:absolute;border-radius:50%;animation:tw2 2s ease-in-out infinite}@keyframes tw2{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
#splash .fi2{position:absolute;bottom:-70px;color:#f3d27a;opacity:.25;animation:fl2 linear infinite}@keyframes fl2{to{transform:translateY(-115vh) rotate(360deg)}}
.theme-switch{display:flex;gap:8px;align-items:center}.theme-switch button{font-size:16px}
.banner-photo{position:relative;background-size:cover!important;background-position:center!important}.banner-photo:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000b,#0003)}
.banner-photo>*{position:relative;z-index:1}.video-box{position:relative;border-radius:20px;overflow:hidden;background:#000;margin:14px 0;border:1px solid var(--bd)}
.video-box video{width:100%;height:330px;object-fit:cover;display:block}.video-fallback{height:330px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.video-fallback .ss{position:absolute;inset:0;height:100%;width:100%;border-radius:0}.video-fallback .ss img{height:100%;width:100%}.video-label{position:absolute;z-index:2;bottom:15px;right:15px;left:15px;background:#0008;color:#fff;border-radius:12px;padding:10px 14px}
.plan-card{min-height:300px;padding:22px;border-radius:22px;position:relative;overflow:hidden;border:2px solid var(--bd);display:flex;flex-direction:column;justify-content:space-between}.plan-card:before{content:"";position:absolute;inset:-40%;background:radial-gradient(circle,#fff2,transparent 55%);pointer-events:none}.plan-card>*{position:relative}
.plan-1{background:linear-gradient(145deg,#123b2d,#0e8f6a);color:#fff}.plan-2{background:linear-gradient(145deg,#31205f,#8a3ffc);color:#fff}.plan-3{background:linear-gradient(145deg,#6b2b16,#f97316);color:#fff}.plan-4{background:linear-gradient(145deg,#102f58,#3b82f6);color:#fff}.plan-5{background:linear-gradient(145deg,#5a4109,#d4a72c);color:#fff}.plan-card .pr{font-size:32px;color:inherit}.plan-card button{background:#fff;color:#111;border:0;font-size:18px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.stat{padding:20px;border-radius:18px;background:var(--card);border:1px solid var(--bd);text-align:center}.stat strong{display:block;font-size:34px}
.notice{padding:14px;border-radius:14px;background:color-mix(in srgb,var(--ac) 13%,var(--card));border:1px solid var(--bd)}
@media(max-width:700px){nav{justify-content:flex-start;flex-wrap:nowrap}nav button{font-size:16px;padding:11px 14px}.hero h1{font-size:34px}.video-box video,.video-fallback{height:230px}}

.real-product-photo{height:210px!important;position:relative;overflow:hidden;border-radius:14px;background:var(--card)}
.real-product-photo img{position:absolute!important;inset:0;width:100%!important;height:100%!important;object-fit:contain!important;padding:8px;box-sizing:border-box;opacity:0;transition:opacity .45s}
.real-product-photo img.a{opacity:1}

/* AZIMI STORE REAL CATEGORY PHOTO SLIDESHOW */
.cat-photo-wrap{position:absolute;inset:0;border-radius:inherit;overflow:hidden;z-index:0;background:#132018}
.cat-photo-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .75s ease,transform 3.6s ease;transform:scale(1.02)}
.cat-photo-wrap img.a{opacity:1;transform:scale(1.08)}
.cats .photo-cat{position:relative;overflow:hidden;min-height:145px!important;padding:0!important;color:#fff!important;background:#142019!important;display:flex!important;align-items:flex-end!important;justify-content:center!important;border:1px solid #ffffff18!important;box-shadow:inset 0 -55px 55px #0009,0 8px 25px #0002}
.cats .photo-cat:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0001 10%,#0002 42%,#000c 100%);z-index:1;pointer-events:none}
.cats .photo-cat .cat-content{position:relative;z-index:2;width:100%;padding:14px 8px 12px;text-shadow:0 2px 8px #000;display:flex;flex-direction:column;align-items:center;gap:5px}
.cats .photo-cat .cat-content i{font-size:30px;margin:0!important;color:#fff}
.cats .photo-cat .cat-content b{font-size:17px;line-height:1.45}
.store-photo-banner{position:relative;height:240px;border-radius:20px;overflow:hidden;margin-bottom:14px;border:1px solid var(--bd);background:#0b241b;box-shadow:0 14px 35px #0003}
.store-photo-banner .store-banner-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s ease,transform 5s ease;transform:scale(1.03)}
.store-photo-banner .store-banner-img.a{opacity:1;transform:scale(1.1)}
.store-photo-banner:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000b,#0003 50%,#0009);pointer-events:none}
.store-photo-banner .store-banner-content{position:absolute;z-index:2;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:20px;text-shadow:0 3px 18px #000}
.store-photo-banner h1{font-size:42px;margin:0 0 8px;color:#fff;direction:ltr}
.store-photo-banner #storeTw{min-height:55px;font-size:23px;color:#f3d27a;font-weight:700}
.store-photo-banner .store-bar{width:min(380px,70%);height:4px;background:#fff4;border-radius:8px;overflow:hidden;margin-top:12px}
.store-photo-banner .store-bar i{display:block;height:100%;width:0;background:#f3d27a;animation:storeBar 5s linear infinite}
@keyframes storeBar{from{width:0}to{width:100%}}
.top-photo-sl{background:#101b14!important;position:relative;overflow:hidden!important}
.top-photo-sl .top-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s ease,transform 4s ease;transform:scale(1.04)}
.top-photo-sl .top-photo.a{opacity:1;transform:scale(1.1)}
.top-photo-sl:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000a,#0002,#000a);pointer-events:none}
.top-photo-sl .top-photo-text{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;color:#fff;text-shadow:0 2px 12px #000;padding:15px}
.top-photo-sl .top-photo-text i{font-size:48px;margin-bottom:6px}
.top-photo-sl .top-photo-text b{font-size:25px}
@media(max-width:700px){.cats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cats .photo-cat{min-height:140px!important}.cats .photo-cat .cat-content b{font-size:15px}.store-photo-banner{height:205px}.store-photo-banner h1{font-size:34px}.store-photo-banner #storeTw{font-size:18px}.top-photo-sl .top-photo-text b{font-size:20px}}

/* ===== SETTINGS / SWITCH / CALENDAR / LOCK ===== */
.sw{position:relative;width:96px;height:44px;border-radius:30px;border:0;padding:0;background:#8a8f86;direction:ltr;transition:background .3s;cursor:pointer;flex:none}
.sw:hover{transform:none}
.sw .kn{position:absolute;top:4px;left:4px;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 2px 6px #0004;transition:transform .3s}
.sw b{position:absolute;top:0;bottom:0;right:14px;display:flex;align-items:center;font-size:15px;color:#fff;letter-spacing:.5px}
.sw.sw-on{background:var(--ac)}.sw.sw-on .kn{transform:translateX(52px)}.sw.sw-on b{right:auto;left:14px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.set-sec{margin-top:12px}.set-sec h3{margin:0 0 8px}.set-top{border:2px solid var(--ac)}
.av-ph{display:flex;align-items:center;justify-content:center;font-size:36px;color:var(--mut)}
.subf{padding:10px 0;border-top:1px dashed var(--bd);margin-top:6px}
.pin-in{text-align:center;letter-spacing:8px;font-size:22px;direction:ltr}
.cal-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-grid div{padding:9px 0;border-radius:10px}.cal-h{color:var(--mut);font-size:14px}
.cal-t{background:var(--ac);color:#fff;font-weight:700}.cal-f{color:#e03131}.cal-t.cal-f{color:#fff}
.hl{list-style:none;margin:0 0 12px;padding:0}.hl li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.hl img{width:44px;height:44px;border-radius:10px;object-fit:cover}.hl .gr{flex:1;min-width:150px}
.hsub{margin:14px 0 6px;font-size:18px}
#lock{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;background:linear-gradient(135deg,#05261c,#0b3d2e 60%,#3a2a05);color:#fff;text-align:center;direction:ltr;padding:20px}
#lock h2{margin:6px 0;color:#f3d27a;font-family:Georgia,serif}.lk-ic{font-size:44px;color:#f3d27a}
.lk-msg{min-height:30px;font-size:17px}
.lk-dots{display:flex;gap:14px;justify-content:center;margin:14px 0}.lk-dots span{width:16px;height:16px;border-radius:50%;border:2px solid #f3d27a}.lk-dots span.f{background:#f3d27a}
.lk-pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;justify-content:center;margin-top:16px}
.lk-pad button{height:76px;border-radius:50%;font-size:28px;background:#ffffff18;color:#fff;border:1px solid #ffffff30;padding:0}
.shake{animation:shk .35s}@keyframes shk{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}

/* ===== settings v2: whatsapp-style profile, accordions ===== */
.sw .kn{display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1}
.set-list{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.pf{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:14px 4px 8px}

/* ===== v4: smaller text, logo slot, big home tabs, text effects ===== */
body{font-size:16px}
nav button{font-size:15px;padding:10px 14px;min-height:44px}

function drawMap(){let x=p=>(p.lo-60)/15*1698,y=p=>(39.5-p.la)/10.5*1305;$('#map').innerHTML=P.map(p=>`<g class="province-pin" onclick="pv('${p.n}')"><circle cx="${x(p)}" cy="${y(p)}" r="10"/><text x="${x(p)}" y="${y(p)-15}" text-anchor="middle">${p.n}</text></g>`).join('')+(me_pos?`<g class="my-gps"><circle cx="${x({lo:me_pos.lo})}" cy="${y({la:me_pos.la})}" r="15"/><circle cx="${x({lo:me_pos.lo})}" cy="${y({la:me_pos.la})}" r="28"/></g>`:'')}
function pv(n){let p=P.find(q=>q.n==n);$('#pi').innerHTML=`<div class="card" style="margin-top:10px"><h3>${n}</h3><a href="https://www.google.com/maps/dir/?api=1&destination=${p.la},${p.lo}" target="_blank" rel="noopener"><button class="pri"><i class="fa-solid fa-route"></i>${t('route')}</button></a></div>`}
function gps(){if(!navigator.geolocation){$('#gm').textContent='GPS !';return}navigator.geolocation.getCurrentPosition(r=>{me_pos={la:r.coords.latitude,lo:r.coords.longitude};drawMap();let n=near();$('#gm').textContent=n.n;pv(n.n)},()=>{$('#gm').textContent='GPS !'})}
function setTheme(x){document.documentElement.dataset.theme=x;S.theme=x;sv()}function downloadDB(){let data={version:3,exportedAt:new Date().toISOString(),data:S};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='azimi-store-database-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}function importDB(i){let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);S=x.data||x;sv();location.reload()}catch(e){alert('Invalid database file')}};r.readAsText(f)}function approveReq(i){let r=(S.planRequests||[])[i];if(!r)return;let u=S.users.find(x=>x.id==r.user);let p=S.plans.find(x=>x.id==r.plan);if(!u||!p)return;u.plan=p.id;u.exp=Date.now()+p.days*864e5;u.approved=1;r.status='approved';r.approvedAt=Date.now();plog(u.id,p.id,'active');sv();go('admin')}function setVideo(){let f=$('#vf')?.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{S.video=r.result;sv();go('admin')};r.readAsDataURL(f)}function setBanner(){let f=$('#bf')?.files?.[0],k=$('#bk')?.value;if(!f||!k)return;rd(f,d=>{S.img[k]=d;sv();go('admin')})}

const xLogoSrc=()=>S.img.logo||XLOGO;
{const e=document.querySelector('.sp-logo');if(e)e.src=XLOGO}
const xLogo=()=>`<span class="logo"><span class="logo-img"><i class="fa-solid fa-store"></i><img src="${xLogoSrc()}" alt="" onerror="this.remove()"></span><span class="logo-t">Azimi Store</span></span>`;
function xWa(n){let d=String(n||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('0'))return'93'+d.slice(1);if(d.length==9)return'93'+d;return d}
const xMine=(p,u)=>p.owner?p.owner==u.id:p.seller==u.wa;
const xMyNums=u=>{const s=new Set([u.wa,xWa(u.wa)]);S.products.forEach(p=>{if(xMine(p,u)){s.add(p.seller);s.add(xWa(p.seller))}});return s};
function xLines(its){const m=new Map();its.forEach(x=>m.set(x.id,{x,q:(m.get(x.id)||{q:0}).q+1}));return[...m.values()].map(({x,q})=>`${x.name}${q>1?' ×'+q:''} - ${x.price}${q>1?' = '+(+x.price*q):''}`)}
function xTot(its){return its.reduce((a,x)=>a+(+x.price||0),0)}
function xLocBlock(){const u=me()||{};return`<div class="locb"><label class="mut"><i class="fa-brands fa-whatsapp"></i> ${t('waLabel')}</label><input id="fwa" type="tel" inputmode="tel" dir="ltr" value="${esc(u.pwa||u.wa||'')}" placeholder="07xxxxxxxx"><label class="mut" style="display:block;margin-top:8px"><i class="fa-solid fa-location-dot"></i> ${t('liveAt')}</label><select id="fpv"><option value="">${t('choosePrv')}</option>${P.map(p=>`<option ${u.prov==p.n?'selected':''}>${p.n}</option>`).join('')}</select><input id="fad" value="${esc(u.addr||'')}" placeholder="${t('addrPh')}"></div>`}
const xp=()=>{try{return Object.assign({n:1,sys:0},JSON.parse(localStorage.getItem('az_prefs')||'{}'))}catch(e){return{n:1,sys:0}}};
const xps=o=>{try{localStorage.setItem('az_prefs',JSON.stringify(o))}catch(e){}};
function xNotify(h,title,body){const p=xp();if(p.n)xToast(h,1);if(p.sys&&window.Notification&&Notification.permission=='granted'){try{new Notification(title,{body,icon:'icons/icon-192.png'})}catch(e){}}}
let xtt;function xToast(h,force){if(!force&&!xp().n)return;let e=$('#toast');if(!e){document.body.insertAdjacentHTML('beforeend','<div id="toast" role="status"></div>');e=$('#toast')}e.innerHTML=h;requestAnimationFrame(()=>e.classList.add('show'));clearTimeout(xtt);xtt=setTimeout(()=>e.classList.remove('show'),7000)}
function xSaved(p){xNotify(`<i class="fa-solid fa-circle-check ti"></i><div><b>${t('savedOk')}</b><div class="mut">${t('savedIn')}: <b style="display:inline">${esc(C[p.cat]?cn(C[p.cat]):'')}</b>${p.prov?' • '+esc(p.prov):''}</div><button class="pri" onclick="catF=${p.cat};go('shop');$('#toast').classList.remove('show')">${t('viewIt')}</button></div>`,t('savedOk'),p.name)}
function xCartBadge(){const nb=[...document.querySelectorAll('#nav button')].find(x=>(x.getAttribute('onclick')||'')=="go('cart')");if(nb)nb.innerHTML=`<i class="fa-solid fa-cart-shopping"></i>${t('cart')}${S.cart.length?' ('+S.cart.length+')':''}`}
function xAdd(id){const p=S.products.find(x=>x.id==id);if(!p)return;const q=S.cart.filter(x=>x==id).length,max=+p.qty||99;
 if(q>=max){xToast(`<i class="fa-solid fa-circle-exclamation ti" style="color:#e03131"></i><div><b>${t('noStock')}</b><div class="mut">${esc(p.name)}</div></div>`,1);return}
 S.cart.push(id);sv();xCartBadge();
 xNotify(`<i class="fa-solid fa-cart-shopping ti"></i><div><b>${t('addedCart')}</b><div class="mut">${esc(p.name)}</div><button class="pri" onclick="go('cart');$('#toast').classList.remove('show')">${t('viewCart')}</button></div>`,t('addedCart'),p.name)}
/* cart: quantity +/-, trash, total */
function xCartList(){const cnt={};S.cart.forEach(id=>cnt[id]=(cnt[id]||0)+1);
 const rows=Object.keys(cnt).map(id=>({p:S.products.find(q=>q.id==id),q:cnt[id]})).filter(r=>r.p);
 const tot=rows.reduce((a,r)=>a+(+r.p.price||0)*r.q,0),n=rows.reduce((a,r)=>a+r.q,0);
 return`<div class="card">${rows.map(({p,q})=>{const max=+p.qty||99;return`<div class="cart-row"><div class="cart-info"><b>${esc(p.name)}</b><div class="mut"><i class="fa-solid ${C[p.cat]?C[p.cat][0]:'fa-tag'}"></i> ${C[p.cat]?esc(cn(C[p.cat])):''} • ${p.price}</div></div><div class="qty"><button onclick="AZ.cq('${p.id}',-1)" ${q<=1?'disabled':''} aria-label="-"><i class="fa-solid fa-minus"></i></button><span>${q}</span><button onclick="AZ.cq('${p.id}',1)" ${q>=max?'disabled':''} aria-label="+"><i class="fa-solid fa-plus"></i></button></div><button class="trash" onclick="AZ.cdel('${p.id}')" aria-label="${t('del')}"><i class="fa-solid fa-trash-can"></i></button></div>`}).join('')}<div class="cart-total"><span>${t('totalL')} (${n} ${t('itemsL')})</span><strong>${tot}</strong></div></div>`}
R.cart=()=>{if(!S.cart.some(id=>S.products.find(p=>p.id==id)))return`<p class="mut">${t('none')}</p>`;

const xDiv=(a,b)=>~~(a/b),xMod=(a,b)=>a-~~(a/b)*b;
const xBr=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
function xJalCal(jy,wo){let bl=xBr.length,gy=jy+621,leapJ=-14,jp=xBr[0],jm,jump=0,leap,leapG,march,n,i;
 for(i=1;i<bl;i++){jm=xBr[i];jump=jm-jp;if(jy<jm)break;leapJ+=xDiv(jump,33)*8+xDiv(xMod(jump,33),4);jp=jm}
 n=jy-jp;leapJ+=xDiv(n,33)*8+xDiv(xMod(n,33)+3,4);if(xMod(jump,33)===4&&jump-n===4)leapJ++;
 leapG=xDiv(gy,4)-xDiv((xDiv(gy,100)+1)*3,4)-150;march=20+leapJ-leapG;
 if(wo)return{gy,march};
 if(jump-n<6)n=n-jump+xDiv(jump+4,33)*33;
 leap=xMod(xMod(n+1,33)-1,4);if(leap===-1)leap=4;return{leap,gy,march}}
function xG2d(gy,gm,gd){let d=xDiv((gy+xDiv(gm-8,6)+100100)*1461,4)+xDiv(153*xMod(gm+9,12)+2,5)+gd-34840408;d=d-xDiv(xDiv(gy+100100+xDiv(gm-8,6),100)*3,4)+752;return d}
function xD2g(jdn){let j=4*jdn+139361631;j=j+xDiv(xDiv(4*jdn+183187720,146097)*3,4)*4-3908;let i=xDiv(xMod(j,1461),4)*5+308,gd=xDiv(xMod(i,153),5)+1,gm=xMod(xDiv(i,153),12)+1,gy=xDiv(j,1461)-100100+xDiv(8-gm,6);return{gy,gm,gd}}
function xJ2d(jy,jm,jd){let r=xJalCal(jy,true);return xG2d(r.gy,3,r.march)+(jm-1)*31-xDiv(jm,7)*(jm-7)+jd-1}
function xD2j(jdn){let gy=xD2g(jdn).gy,jy=gy-621,r=xJalCal(jy,false),f=xG2d(gy,3,r.march),jd,jm,k=jdn-f;
 if(k>=0){if(k<=185){return{jy,jm:1+xDiv(k,31),jd:xMod(k,31)+1}}k-=186}else{jy-=1;k+=179;if(r.leap===1)k+=1}
 jm=7+xDiv(k,30);jd=xMod(k,30)+1;return{jy,jm,jd}}
